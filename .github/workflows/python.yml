name: Python CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt', 'requirements-dev.txt') }}
          restore-keys: pip-
      
      - name: Install dependencies
        run: pip install -r backend/requirements.txt && pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v